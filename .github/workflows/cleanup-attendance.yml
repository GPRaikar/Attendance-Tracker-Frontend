name: Monthly Attendance Data Cleanup

on:
  schedule:
    # 06:00 IST on the 21st of every month
    - cron: '30 0 21 * *'
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Report what would be deleted without deleting it'
        type: boolean
        default: true

jobs:
  cleanup:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run cleanup script
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          AWS_REGION: ${{ secrets.AWS_REGION }}
          DYNAMODB_TABLE_NAME: ${{ secrets.DYNAMODB_TABLE_NAME }}
          HOLIDAYS_TABLE_NAME: CompanyHolidays
          APP_TIMEZONE: Asia/Kolkata
          RETENTION_DAYS: '90'
          DRY_RUN: ${{ inputs.dry_run || 'false' }}
        run: python scripts/cleanup_old_attendance.py

      - name: Log cleanup completion
        if: success()
        run: echo "✅ Attendance data cleanup completed successfully"

      - name: Log cleanup failure
        if: failure()
        run: echo "❌ Attendance data cleanup failed"
