name: Mark Unresponsive Users

on:
  schedule:
    - cron: '30 15 * * 1-5'  # 21:00 IST (15:30 UTC), Mon–Fri
  workflow_dispatch:

jobs:
  mark-unresponsive:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip

      - name: Install Dependencies
        run: pip install -r requirements.txt

      - name: Run mark_unresponsive.py
        run: python scripts/mark_unresponsive.py
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          AWS_REGION: ${{ secrets.AWS_REGION }}
          DYNAMODB_TABLE_NAME: ${{ secrets.DYNAMODB_TABLE_NAME }}
          HOLIDAYS_TABLE_NAME: CompanyHolidays
          APP_TIMEZONE: Asia/Kolkata
          SLACK_USER_IDS: ${{ secrets.SLACK_USER_IDS }}
